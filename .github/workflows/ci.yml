name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read Rust toolchain
        id: rust-version
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
      - run: python tools/verify.py
      - name: Verify discovery downstream features and decoded bodies
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fetch --locked --manifest-path crates/openbindings-http-discovery/tests/feature-witness/Cargo.toml
          python3 crates/openbindings-http-discovery/tests/feature_lock_test.py
          python3 crates/openbindings-http-discovery/tests/feature-unification.py
      - name: Verify core acquisition boundaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked --manifest-path tools/no-io/Cargo.toml
          python tools/verify-no-io.py --binary target/debug/sdk-no-io --output target/no-io-receipt
  package:
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read Rust toolchain
        id: rust-version
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Verify development-toolchain stack margin
        run: |
          cargo test --locked -p openbindings --test document_stack
          cargo test --locked --release -p openbindings-json-schema-evaluator --test pattern_stack --test evaluation_stack --test walk_stack
      - name: Check out the SDK's declared specification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/spec
          ref: 30416ef1ca626e58eb8c383a0c71422a68f9243f
          path: .ci-spec
      - run: node tools/verify-spec.mjs . .ci-spec 30416ef1ca626e58eb8c383a0c71422a68f9243f --self-test
      - name: Remove temporary specification checkout before clean-candidate checks
        run: python -c "import shutil; shutil.rmtree('.ci-spec')"
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --ignore-scripts
        working-directory: packages/typescript
      - run: npm run build:wasm && npm run build && npm test && npm run test:types && npm run format:check && npm run test:package
        working-directory: packages/typescript
      - name: Verify clean candidate archives and Wasm identity
        run: python tools/package-candidate.py --output target/release-candidate
      - run: python tools/verify-api-reference.py --typescript-only
      - name: Build and check the complete reference bundle
        run: python tools/build-reference.py --output "${{ github.workspace }}/target/reference"
      - name: Verify container findings through native and TypeScript APIs
        run: |
          cargo build --locked --manifest-path tools/conformance-observer/Cargo.toml
          python tools/qualification/replay/check-container-findings.py --binary target/debug/sdk-production-observer
      - run: python tools/verify-source-inspection.py --archives --wasm
      - run: python tools/verify-interface-synthesis.py --archives --wasm
      - run: python tools/verify-binding-invocation.py --archives --wasm
      - name: Hand the built package to the browser job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-dist
          path: packages/typescript/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  browser:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every browser system dependency ships in Playwright's image, so this job
    # never installs packages from the runner's apt mirror. Keep the tag and its
    # multi-architecture index digest at the package lock's playwright-core
    # version; the first check below fails when they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 5
        with:
          python-version: '3.13'
      - name: Require the image's Playwright to match the package lock
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          lock = json.loads(pathlib.Path('packages/typescript/package-lock.json').read_text(encoding='utf-8'))
          locked = lock['packages']['node_modules/playwright-core']['version']
          # Playwright's image records the release that installed its browsers.
          image = json.loads(pathlib.Path('/ms-playwright/.docker-info').read_text(encoding='utf-8'))
          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          declared = re.findall(r'^\s*image:\s*(mcr\.microsoft\.com/playwright:\S+)@sha256:[0-9a-f]{64}\s*$', workflow, re.M)
          if image['driverVersion'] != locked or declared != [image['dockerImageName']]:
              raise SystemExit(
                  f'The package lock has playwright-core {locked}, but this image records '
                  f'{image["driverVersion"]} as {image["dockerImageName"]} and the workflow '
                  f'declares {declared}. Pin mcr.microsoft.com/playwright:v{locked}-noble '
                  'by its index digest in .github/workflows/ci.yml.')
          print(f'{image["dockerImageName"]} provides playwright-core {locked} and its browsers')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: typescript-dist
          path: packages/typescript/dist
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
        working-directory: packages/typescript
      - run: python tools/qualification/replay/prepare-browser-fixtures.py
      - run: node packages/typescript/test/browser.mjs chromium
      - run: python tools/qualification/replay/judge-browser.py tools/qualification/hosts/chromium
      - run: node packages/typescript/test/browser.mjs webkit
      - run: python tools/qualification/replay/judge-browser.py tools/qualification/hosts/webkit

  wasm-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read Rust toolchain
        id: rust-version
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Rebuild the Wasm from another checkout path and Cargo home
        run: python tools/verify-wasm-reproducibility.py --output "$RUNNER_TEMP/wasm-reproducibility"

  msrv:
    env:
      RUST_MSRV: '1.88.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_MSRV }}
          targets: wasm32-unknown-unknown
      - name: Test minimum supported APIs with documented stack exclusions
        run: python tools/verify-msrv.py --version "$RUST_MSRV" --test
      - run: cargo +"$RUST_MSRV" build -p openbindings-wasm --target wasm32-unknown-unknown --locked

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/verify-advisory-policy.py --self-test
      - name: Read Rust toolchain
        id: rust-version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --workspace --all-features --locked
          # The action's container honors rust-toolchain.toml, so install that toolchain.
          rust-version: ${{ steps.rust-version.outputs.version }}

  ci:
    if: always()
    needs: [native, package, browser, wasm-reproducibility, msrv, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Required job results: ' + repr(results))
          PY
