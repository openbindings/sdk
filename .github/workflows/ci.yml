name: SDK qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features openbindings-http-discovery/native -- -D warnings
      - run: cargo test --locked --workspace --features openbindings-http-discovery/native
      - run: cargo build --locked --release --workspace
      - run: cargo build --locked --manifest-path tools/conformance-observer/Cargo.toml
      - run: python tools/qualification/replay/corpus.py
      - run: python tools/qualification/replay/production-corpus.py --binary target/debug/sdk-production-observer${{ runner.os == 'Windows' && '.exe' || '' }}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --ignore-scripts
        working-directory: packages/typescript
      - run: npm run build:wasm && npm run build && npm test && npm run test:types && npm run format:check
        working-directory: packages/typescript
      - run: npx playwright-core install --with-deps chromium webkit
        working-directory: packages/typescript
      - run: python tools/qualification/replay/prepare-browser-fixtures.py
      - run: node packages/typescript/test/browser.mjs chromium
      - run: python tools/qualification/replay/judge-browser.py tools/qualification/hosts/chromium
      - run: node packages/typescript/test/browser.mjs webkit
      - run: python tools/qualification/replay/judge-browser.py tools/qualification/hosts/webkit
