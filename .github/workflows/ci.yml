name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0 # temporary required-helper skip control
  browser:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  ci:
    if: always()
    needs: [native, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Required job results: ' + repr(results))
          PY
