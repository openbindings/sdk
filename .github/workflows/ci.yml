# Diagnostic branch only, not for merge: measure pattern stack depth on Windows.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read Rust toolchain
        id: rust-version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Build probes (debug)
        run: |
          cargo build --locked -p openbindings-json-schema-evaluator --example pattern_stack_probe
          cargo build --locked --manifest-path tools/diag-regress-phases/Cargo.toml
      - name: Evaluator phases (debug)
        env:
          PROBE_STACKS: 256,512,1024,2048
        run: ./target/debug/examples/pattern_stack_probe.exe
      - name: Regress stages (debug)
        env:
          PROBE_STACKS: 256,512,1024,2048
        run: ./target/debug/diag-regress-phases.exe
      - name: pattern_stack test as committed (debug)
        continue-on-error: true
        run: cargo test --locked -p openbindings-json-schema-evaluator --test pattern_stack
      - name: Build probes (release)
        run: |
          cargo build --locked --release -p openbindings-json-schema-evaluator --example pattern_stack_probe
          cargo build --locked --release --manifest-path tools/diag-regress-phases/Cargo.toml
      - name: Evaluator phases (release)
        env:
          PROBE_STACKS: 64,128,256,512
        run: ./target/release/examples/pattern_stack_probe.exe
      - name: Regress stages (release)
        env:
          PROBE_STACKS: 48,64,128,256
        run: ./target/release/diag-regress-phases.exe
      - name: pattern_stack test as committed (release)
        continue-on-error: true
        run: cargo test --locked --release -p openbindings-json-schema-evaluator --test pattern_stack
