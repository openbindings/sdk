name: Evaluator performance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # Outcomes and requested heap/allocation counts enforce now.
    # Timing and RSS remain advisory while runner noise is calibrated.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read pinned compiler
        id: compiler
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.compiler.outputs.version }}
      - name: Prepare the merge-base source
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          mkdir -p "$RUNNER_TEMP/evaluator-baseline" "$RUNNER_TEMP/evaluator-results" "$RUNNER_TEMP/evaluator-bin"
          git merge-base "$BASE_REF" HEAD > "$RUNNER_TEMP/evaluator-results/baseline-revision.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/evaluator-results/candidate-revision.txt"
          git archive "$(cat "$RUNNER_TEMP/evaluator-results/baseline-revision.txt")" | tar -x -C "$RUNNER_TEMP/evaluator-baseline"
      - name: Build identical or confined cross-API release instruments
        id: build
        run: |
          python tools/evaluator-bench/compare.py build \
            --baseline-source "$RUNNER_TEMP/evaluator-baseline" \
            --candidate-source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/evaluator-results" \
            --binaries "$RUNNER_TEMP/evaluator-bin" \
            --target "$RUNNER_TEMP/evaluator-build"
          uname -a > "$RUNNER_TEMP/evaluator-results/host.txt"
          lscpu >> "$RUNNER_TEMP/evaluator-results/host.txt"
      - name: Check comparison policy and instrument observations
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/evaluator-build
        run: |
          python tools/evaluator-bench/test_policy.py
          cargo test --locked --manifest-path tools/evaluator-bench/Cargo.toml
      - name: Enforce outcomes and memory on serial pairs
        if: steps.build.outputs.comparable != 'false'
        run: |
          python tools/evaluator-bench/compare.py \
            --baseline "$RUNNER_TEMP/evaluator-bin/baseline" \
            --candidate "$RUNNER_TEMP/evaluator-bin/candidate" \
            --baseline-alloc "$RUNNER_TEMP/evaluator-bin/baseline-alloc" \
            --candidate-alloc "$RUNNER_TEMP/evaluator-bin/candidate-alloc" \
            --output "$RUNNER_TEMP/evaluator-results" --enforce
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evaluator-results/summary.md" ]; then
            cat "$RUNNER_TEMP/evaluator-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not complete; inspect build logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evaluator-performance
          path: ${{ runner.temp }}/evaluator-results
