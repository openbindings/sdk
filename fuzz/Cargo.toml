[package]
name = "openbindings-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
openbindings-context = { path = "../crates/openbindings-context" }
openbindings-invocation = { path = "../crates/openbindings-invocation" }
openbindings-source-pull = { path = "../crates/openbindings-source-pull" }
openbindings-kind-description = { path = "../crates/openbindings-kind-description" }
openbindings-schema-comparison = { path = "../crates/openbindings-schema-comparison" }
libfuzzer-sys = "=0.4.10"
openbindings = { path = "../crates/openbindings" }
openbindings-internal-json = { path = "../crates/openbindings-internal-json" }
openbindings-json-schema-evaluator = { path = "../crates/openbindings-json-schema-evaluator" }
serde_json = "1.0.151"

[[bin]]
