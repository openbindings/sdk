[package]
rust-version = "1.88"
name = "openbindings-consumer-compat"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
ap = ["serde_json/arbitrary_precision"]
# A consumer whose maps keep their insertion order.
po = ["serde_json/preserve_order"]
sdk = ["dep:openbindings"]
evaluator = ["sdk", "dep:openbindings-json-schema-evaluator"]
native = ["evaluator", "dep:openbindings-http-discovery", "openbindings-http-discovery/native", "dep:reqwest", "dep:tokio", "dep:bytes"]

portable = ["sdk", "dep:openbindings-http-discovery"]

context = ["sdk", "dep:openbindings-context"]
kinds = ["sdk", "dep:openbindings-kind-description"]
comparison = ["sdk", "dep:openbindings-schema-comparison"]
pull = ["sdk", "dep:openbindings-source-pull"]

invocation = ["sdk", "dep:openbindings-invocation"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
openbindings = { path = "../../crates/openbindings", optional = true, default-features = false }
openbindings-json-schema-evaluator = { path = "../../crates/openbindings-json-schema-evaluator", optional = true }
openbindings-http-discovery = { path = "../../crates/openbindings-http-discovery", optional = true, default-features = false }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls"] }
tokio = { version = "1.53.2", optional = true, features = ["rt", "macros", "time"] }
bytes = { version = "1.12.1", optional = true }
openbindings-context = { path = "../../crates/openbindings-context", optional = true }
openbindings-kind-description = { path = "../../crates/openbindings-kind-description", optional = true }
openbindings-schema-comparison = { path = "../../crates/openbindings-schema-comparison", optional = true }
openbindings-source-pull = { path = "../../crates/openbindings-source-pull", optional = true }
openbindings-invocation = { path = "../../crates/openbindings-invocation", optional = true }
