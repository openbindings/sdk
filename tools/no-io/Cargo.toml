[package]
rust-version = "1.88"
name = "sdk-no-io"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
openbindings = { path = "../../crates/openbindings" }
openbindings-json-schema-evaluator = { path = "../../crates/openbindings-json-schema-evaluator" }
# Deliberately enable retrieval on the schema library the SDK uses. This is a
# white-box positive control, not a supported SDK extension API.
jsonschema = { version = "=0.58.6", default-features = false, features = ["resolve-http", "resolve-file", "tls-ring"] }
serde_json = "1.0.151"
