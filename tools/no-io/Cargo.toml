[package]
name = "sdk-no-io"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
openbindings = { path = "../../crates/openbindings" }
openbindings-json-schema-evaluator = { path = "../../crates/openbindings-json-schema-evaluator" }
# Deliberately enable retrieval on the same private dependency used by the SDK.
# These are white-box positive controls, not supported SDK extension APIs.
jsonschema = { package = "openbindings-internal-jsonschema", path = "../../vendor/openbindings-internal-jsonschema", default-features = false, features = ["resolve-http", "resolve-file", "tls-ring"] }
serde_json = "1.0.151"
