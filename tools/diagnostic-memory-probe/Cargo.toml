[package]
name = "openbindings-diagnostic-memory-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Allocator instrumentation is isolated from the safe SDK workspace.
[workspace]

[dependencies]
openbindings = { path = "../../crates/openbindings" }
openbindings-internal-schema = { path = "../../crates/openbindings-internal-schema" }
openbindings-internal-json = { path = "../../crates/openbindings-internal-json" }
jsonschema = { package = "openbindings-internal-jsonschema", path = "../../vendor/openbindings-internal-jsonschema", default-features = false, features = ["arbitrary-precision"] }
serde_json = { package = "openbindings-internal-serde-json", path = "../../vendor/openbindings-internal-serde-json", features = ["arbitrary_precision"] }
