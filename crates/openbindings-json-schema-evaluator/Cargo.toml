[package]
name = "openbindings-json-schema-evaluator"
description = "Optional bounded JSON Schema 2020-12 evaluator for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
serde_json.workspace = true
jsonschema = { workspace = true, features = ["idna"] }
# Extract the already-pinned engine Unicode tables after strict ECMA name validation.
regex-syntax = "=0.8.11"
# Restored private baseline compiler; no public selection API.
regex = "=1.13.1"
# Prepared programs own immutable NFAs; each value call owns its search cache.
# Matching work is charged from states and outgoing edges.
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode"] }

openbindings-internal-json = { version = "=0.2.0-alpha.1", path = "../openbindings-internal-json", features = ["evaluator-work"] }
serde.workspace = true

openbindings-internal-schema = { version = "=0.2.0-alpha.1", path = "../openbindings-internal-schema" }

[dev-dependencies]
openbindings-schema-evaluator-test-support = { version = "=0.2.0-alpha.1", path = "../openbindings-schema-evaluator-test-support" }
# Independent matcher used only by Reader equivalence tests.
regex = "=1.13.1"
