[package]
name = "openbindings-json-schema-evaluator"
description = "Optional bounded JSON Schema 2020-12 evaluator for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
serde_json.workspace = true
jsonschema.workspace = true
# The linear-time engine that matches `pattern` values.
regex = "1.13.1"

openbindings-internal-json = { version = "=0.2.0-alpha.1", path = "../openbindings-internal-json", features = ["evaluator-work"] }
serde.workspace = true

openbindings-internal-schema = { version = "=0.2.0-alpha.1", path = "../openbindings-internal-schema" }

[features]
# Not for applications. The SDK's own tests and verification tools enable it:
# every preparation then also converts core's projection from its text and
# checks that it gives the definitions' conversion, at about twice the cost.
conversion-check = []

[dev-dependencies]
# The crate's own tests run with the conversion check.
openbindings-json-schema-evaluator = { path = ".", features = ["conversion-check"] }
