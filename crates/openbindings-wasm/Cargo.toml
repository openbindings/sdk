[package]
name = "openbindings-wasm"
description = "Private WebAssembly bridge for the first-class OpenBindings TypeScript SDK"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
openbindings-http-discovery = { version = "=0.2.0-alpha.1", path = "../openbindings-http-discovery" }
wasm-bindgen.workspace = true
# Warm the engine's existing randomized hash seed at the explicit host boundary.
ahash = "=0.8.12"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.openbindings-json-schema-evaluator]
version = "=0.2.0-alpha.1"
path = "../openbindings-json-schema-evaluator"

[dependencies.openbindings-internal-json]
version = "=0.2.0-alpha.1"
path = "../openbindings-internal-json"

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true
