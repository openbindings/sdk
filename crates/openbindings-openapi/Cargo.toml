[package]
name = "openbindings-openapi"
description = "Optional OpenAPI kind adapter for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", path = "../openbindings-source-inspection" }
openbindings-interface-synthesis = { version = "=0.2.0-alpha.1", path = "../openbindings-interface-synthesis" }
openbindings-invocation = { version = "=0.2.0-alpha.1", path = "../openbindings-invocation" }
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "fe09522a9b99a6c6b4918e3de0467b5a638afa5e", version = "=0.0.0" }
serde_json_compat.workspace = true
fluent-uri.workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "io-util"] }
dynamic-openapi-client-reqwest = { git = "https://github.com/openbindings/openapi-client", rev = "fe09522a9b99a6c6b4918e3de0467b5a638afa5e", version = "=0.0.0" }
openbindings-json-schema-evaluator = { version = "=0.2.0-alpha.1", path = "../openbindings-json-schema-evaluator" }
