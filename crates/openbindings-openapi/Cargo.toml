[package]
name = "openbindings-openapi"
description = "Optional OpenAPI kind adapter for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", path = "../openbindings-source-inspection" }
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "7cec696f19259cffd411c96d4c50f68c4c313558", version = "=0.0.0" }
serde_json_compat.workspace = true
fluent-uri.workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
