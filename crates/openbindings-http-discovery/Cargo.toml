[package]
name = "openbindings-http-discovery"
description = "Optional HTTP discovery client and immutable publication for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings-internal-cancellation = { version = "=0.2.0-alpha.1", path = "../openbindings-internal-cancellation" }
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
fluent-uri.workspace = true
serde.workspace = true
url = "2.5.8"

[features]
default = []
native = ["dep:reqwest", "dep:tokio", "dep:bytes"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", optional = true, features = ["time"] }
bytes = { version = "1.12.1", optional = true }

[dev-dependencies]
openbindings-invocation = { version = "=0.2.0-alpha.1", path = "../openbindings-invocation" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", path = "../openbindings-source-inspection" }
openbindings-interface-synthesis = { version = "=0.2.0-alpha.1", path = "../openbindings-interface-synthesis" }

tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
flate2 = "=1.1.10"
