[package]
name = "openbindings-http-discovery"
description = "Optional HTTP discovery client and immutable publication for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../openbindings" }
fluent-uri.workspace = true
serde.workspace = true

[features]
default = []
native = ["dep:reqwest", "dep:tokio", "dep:bytes"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "=1.53.2", optional = true, features = ["time"] }
bytes = { version = "=1.12.1", optional = true }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync"] }
flate2 = "=1.1.10"
