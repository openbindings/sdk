[package]
rust-version = "1.88"
name = "discovery-feature-witness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
sdk = ["dep:openbindings-http-discovery"]
compression = ["reqwest/gzip", "reqwest/brotli", "reqwest/deflate"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.2", features = ["rt", "macros"] }
openbindings-http-discovery = { path = "../..", optional = true, features = ["native"] }
