[package]
name = "openbindings-caller-example"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
openbindings = "=0.2.0-alpha.1"
openbindings-json-schema-evaluator = "=0.2.0-alpha.1"
openbindings-http-discovery = { version = "=0.2.0-alpha.1", features = ["native"] }
openbindings-schema-evaluator-test-support = "=0.2.0-alpha.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time"] }
serde_json = "=1.0.151"
