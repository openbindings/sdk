[package]
name = "kind-adapter"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
openbindings = "=0.2.0-alpha.1"
openbindings-invocation = "=0.2.0-alpha.1"
openbindings-source-pull = "=0.2.0-alpha.1"
openbindings-kind-description = "=0.2.0-alpha.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros"] }
