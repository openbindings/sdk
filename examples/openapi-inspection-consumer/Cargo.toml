[package]
name = "openapi-inspection-consumer"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["rlib", "cdylib"]
[features]
wasm-probe = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
[dependencies]
openbindings = "=0.2.0-alpha.1"
openbindings-source-inspection = "=0.2.0-alpha.1"
openbindings-openapi = "=0.2.0-alpha.1"
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "7cec696f19259cffd411c96d4c50f68c4c313558", version = "=0.0.0" }
# Qualification counters only; consumer behavior uses public SDK APIs exclusively.
openbindings-internal-json = "=0.2.0-alpha.1"
serde_json = "1.0.151"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
