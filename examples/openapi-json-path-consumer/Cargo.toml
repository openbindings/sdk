[package]
name = "openapi-json-path-consumer"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["rlib", "cdylib"]
[features]
wasm-probe = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
[dependencies]
openbindings = "=0.2.0-alpha.1"
openbindings-source-inspection = "=0.2.0-alpha.1"
openbindings-interface-synthesis = "=0.2.0-alpha.1"
openbindings-invocation = "=0.2.0-alpha.1"
openbindings-json-schema-evaluator = "=0.2.0-alpha.1"
openbindings-openapi = "=0.2.0-alpha.1"
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "fe09522a9b99a6c6b4918e3de0467b5a638afa5e", version = "=0.0.0" }
# Test instrumentation only; the consumer API uses the public packages above.
openbindings-internal-json = "=0.2.0-alpha.1"
serde_json = "1.0.151"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
