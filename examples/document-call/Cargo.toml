[package]
name = "document-call"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", path = "../../crates/openbindings" }
openbindings-invocation = { version = "=0.2.0-alpha.1", path = "../../crates/openbindings-invocation" }
openbindings-json-schema-evaluator = { version = "=0.2.0-alpha.1", path = "../../crates/openbindings-json-schema-evaluator" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
